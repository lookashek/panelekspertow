# Interactive mode: mention @claude in an issue or PR comment and Claude
# analyzes, implements, pushes commits and opens/updates PRs.
# Examples:
#   @claude implement this issue on a new branch and open a PR
#   @claude fix the failing lint in this PR
#   @claude why does the smoke test fail here?
#
# Only users with write access can trigger it. Bots are rejected (no loops).
# Auth: same secret choice as claude-code-review.yml.

name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 40'