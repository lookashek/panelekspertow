# Deploys the Worker to Cloudflare.
#   - push to main  -> production deploy (wrangler deploy)
#   - pull_request   -> preview version (wrangler versions upload), URL posted as a PR comment
#
# Build and deploy must run in the same job/workspace: @astrojs/cloudflare writes a
# `.wrangler/deploy/config.json` redirect next to `dist/` during `astro build` that `wrangler
# deploy` needs to find the generated entry-point. Splitting build/deploy across jobs (even via
# an artifact carrying `dist/`) breaks that redirect - don't reintroduce a separate build job.
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# SUPABASE_URL, SUPABASE_KEY (build-time only - env vars declared optional in astro.config.mjs).
# Runtime secrets (SUPABASE_URL, SUPABASE_KEY, OPENROUTER_API_KEY) live on the Worker itself via
# `wrangler secret put` and are not touched by this workflow.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.deploy.outputs.command-output }}`;
            const match = output.match(/https:\/\/\S+\.workers\.dev\S*/);
            const url = match ? match[0] : null;
            const body = url
              ? `🚀 Preview deployed: ${url}`
              : `⚠️ Preview version uploaded, but no preview URL was found in the wrangler output.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
